[workspace]
name = "t5-reader"
description = "Pocket e-reader for the LilyGo T5-2.13 (host pre-renders, device blits)"
authors = ["David Haasnoot <D.Haasnoot@hkv.nl>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
platformio = ">=6.1,<7"
pillow = ">=11"
pyphen = ">=0.17"
ebooklib = ">=0.17"
beautifulsoup4 = ">=4.12"
lxml = ">=5"
pytest = ">=8"
ruff = ">=0.6"
fonttools = ">=4.50"
font-ttf-ubuntu = ">=0.83"
freetype = ">=2.13"

[pypi-dependencies]
bookprep = { path = "tools/bookprep", editable = true }

[tasks.fw-build]
cmd = "pio run -d firmware"
description = "Build every firmware env (reader + diagnostic sketches); no hardware needed"

[tasks.fw-test]
cmd = "pio test -d firmware -e native"
description = "Unit tests for firmware/lib/core on the PC"

[tasks.fw-flash]
cmd = "pio run -d firmware -e {{ env }} -t upload"
args = [{ arg = "env", default = "reader" }]
description = "Flash one env: pixi run fw-flash [reader|calibration|panel_tester|button_test|sd_test]"

[tasks.fw-dist]
cmd = "bash tools/fw_dist.sh"
description = "Build all envs and collect merged .bin images in out/firmware/ (browser flashing at 0x0)"

[tasks.fw-monitor]
cmd = "pio device monitor -d firmware"
description = "Serial monitor at 115200 baud"

[tasks.prep]
cmd = "bookprep"
description = "Convert EPUB/TXT to .t5b: pixi run prep book.epub --font ... --out out/"

[tasks.font-sheet]
cmd = "python -m bookprep.fontsheet"
description = "Compare fonts/sizes on a book page: pixi run font-sheet book.epub --font X.ttf --sizes 11 12 13"

[tasks.devpages]
cmd = "python -m bookprep.devpages --header firmware/include/test_pages.h --t5b out/devpages.t5b"
description = "Regenerate the calibration/sample pages for the firmware"

[tasks.ui-fonts]
cmd = "bash tools/make_ui_fonts.sh"
description = "Regenerate the menu fonts (bb_epaper fontconvert, Ubuntu, codepage 1252)"

[tasks.ui-preview]
cmd = "bash tools/ui_preview.sh"
description = "Render every firmware screen on the PC (real ui.cpp) to out/ui-preview/"

[tasks.web]
cmd = "python -m bookprep.webassets --header firmware/include/web_assets.h"
description = "Embed the web page, converter, fonts and hyphenation data into the firmware"

[tasks.web-dev]
cmd = "python -m bookprep.webassets --out out/web-dev/www && python -m bookprep.devserver"
description = "Run the reader's web page locally with a fake SD card (add --lan for phone access)"

[tasks.web-test]
cmd = "pytest tools/bookprep/tests/test_webport.py tools/bookprep/tests/test_web_e2e.py tools/bookprep/tests/test_devserver.py"
description = "Browser-converter parity (Node) and end-to-end (headless Chromium) tests"

[tasks.test]
cmd = "pytest tools/bookprep/tests"

[tasks.lint]
cmd = "ruff check tools/bookprep && ruff format --check tools/bookprep"

[tasks.fmt]
cmd = "ruff format tools/bookprep && ruff check --fix tools/bookprep"

; T5-2.13 pocket e-reader firmware.
; Build everything without hardware: `pixi run fw-build`.
; Unit tests on the PC:              `pixi run fw-test`.
; Flash one env:                     `pixi run fw-flash <env>`.

[platformio]
default_envs = reader, calibration, panel_tester, button_test, sd_test

[esp32]
; pioarduino = Arduino-ESP32 core 3.3.x on ESP-IDF 5.5 (official espressif32 stops at core 2.0.17)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev            ; classic ESP32, 4 MB flash, no PSRAM
framework = arduino
lib_deps =
    bitbank2/bb_epaper@2.1.11  ; pinned at bootstrap (2026-10-12), see docs/hardware.md
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"0.5.0\"
    -Wall

; --- the reader application -------------------------------------------------
[env:reader]
extends = esp32
build_src_filter = +<*>

; --- Phase 1: calibration pattern, refresh timing, ghosting test --------------
[env:calibration]
extends = esp32
build_src_filter = -<*> +<../diag/calibration/> +<display.cpp>

; --- Phase 0 diagnostic sketches -------------------------------------------
[env:panel_tester]
extends = esp32
build_src_filter = -<*> +<../diag/panel_tester/>

[env:button_test]
extends = esp32
build_src_filter = -<*> +<../diag/button_test/>

[env:sd_test]
extends = esp32
build_src_filter = -<*> +<../diag/sd_test/>

; --- host unit tests for lib/core (no Arduino, no hardware) ------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra

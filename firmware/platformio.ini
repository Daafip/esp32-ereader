; T5 pocket e-reader firmware: LilyGo T5-2.13 (envs without a suffix), LilyGo
; T5-4.7" S3 (`reader_t547`), M5Stack M5PaperS3 (`reader_m5papers3`) and M5Paper
; (`reader_m5paper`). Board pins: include/boards/.
; Build everything without hardware: `pixi run fw-build`.
; Unit tests on the PC:              `pixi run fw-test`.
; Flash one env:                     `pixi run fw-flash <env>`.

[platformio]
default_envs =
    reader
    calibration
    panel_tester
    button_test
    sd_test
    refresh_test
    reader_t547
    reader_m5papers3
    reader_m5paper

[esp32]
; pioarduino = Arduino-ESP32 core 3.3.x on ESP-IDF 5.5 (official espressif32 stops at core 2.0.17)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev            ; classic ESP32, 4 MB flash, no PSRAM
framework = arduino
; bb_epaper 2.1.11 + upstream commit 1d92424 (2026-07-09: draw 1-px-wide glyphs
; of custom fonts; 2.1.11 drops i . : ' in small fonts). See docs/hardware.md.
lib_deps =
    https://github.com/bitbank2/bb_epaper.git#1d924245b5179cc4a7716f5c8322b8852d79e5c8
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"1.3.0\"
    -Wall

; --- the reader application -------------------------------------------------
[env:reader]
extends = esp32
build_src_filter = +<*>
; 1.9 MB app slots (Wi-Fi + web server don't fit the default 1.25 MB); keeps OTA possible
board_build.partitions = min_spiffs.csv

; --- Phase 1: calibration pattern, refresh timing, ghosting test --------------
[env:calibration]
extends = esp32
build_src_filter = -<*> +<../diag/calibration/> +<display_bbep.cpp>

; --- Phase 0 diagnostic sketches -------------------------------------------
[env:panel_tester]
extends = esp32
build_src_filter = -<*> +<../diag/panel_tester/>

[env:button_test]
extends = esp32
build_src_filter = -<*> +<../diag/button_test/>

[env:sd_test]
extends = esp32
build_src_filter = -<*> +<../diag/sd_test/>

; Checkpoint 1 follow-up: which refresh variants change the glass
[env:refresh_test]
extends = esp32
build_src_filter = -<*> +<../diag/refresh_test/>

; --- 4.7" boards on the ESP32-S3: 16 MB flash, 8 MB OPI PSRAM, FastEPD ---------
; bb_epaper only draws into RAM there; FastEPD drives the panel. Unverified on hardware.
[esp32s3]
extends = esp32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_src_filter = +<*>
lib_deps =
    ${esp32.lib_deps}
    bitbank2/FastEPD@2.2.0
extra_scripts = post:tools/fastepd_symbols.py
build_flags =
    ${esp32.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; LilyGo T5-4.7" S3 (T5-ePaper-S3): one user button (GPIO21), see docs/usage.md
[env:reader_t547]
extends = esp32s3
build_flags = ${esp32s3.build_flags} -DBOARD_T5_47_S3

; M5Stack M5PaperS3: touch only, light sleep between pages, see docs/hardware-m5paper.md
[env:reader_m5papers3]
extends = esp32s3
build_flags = ${esp32s3.build_flags} -DBOARD_M5PAPER_S3

; M5Stack M5Paper (ESP32 + 8 MB PSRAM, IT8951 controller): touch + 3-way switch
[env:reader_m5paper]
extends = esp32
board = m5stack_paper  ; 16 MB flash, PSRAM, default_16MB.csv
build_src_filter = +<*>
build_flags = ${esp32.build_flags} -DBOARD_M5PAPER

; --- host unit tests for lib/core (no Arduino, no hardware) ------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra

; T5-2.13 pocket e-reader firmware.
; Build everything without hardware: `pixi run fw-build`.
; Unit tests on the PC:              `pixi run fw-test`.
; Flash one env:                     `pixi run fw-flash <env>`.

[platformio]
default_envs = reader, calibration, panel_tester, button_test, sd_test

[esp32]
; pioarduino = Arduino-ESP32 core 3.3.x on ESP-IDF 5.5 (official espressif32 stops at core 2.0.17)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev            ; classic ESP32, 4 MB flash, no PSRAM
framework = arduino
; bb_epaper 2.1.11 + upstream commit 1d92424 (2026-07-09: draw 1-px-wide glyphs
; of custom fonts; 2.1.11 drops i . : ' in small fonts). See docs/hardware.md.
lib_deps =
    https://github.com/bitbank2/bb_epaper.git#1d924245b5179cc4a7716f5c8322b8852d79e5c8
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"0.6.0\"
    -Wall

; --- the reader application -------------------------------------------------
[env:reader]
extends = esp32
build_src_filter = +<*>
; 1.9 MB app slots (Wi-Fi + web server don't fit the default 1.25 MB); keeps OTA possible
board_build.partitions = min_spiffs.csv

; --- Phase 1: calibration pattern, refresh timing, ghosting test --------------
[env:calibration]
extends = esp32
build_src_filter = -<*> +<../diag/calibration/> +<display.cpp>

; --- Phase 0 diagnostic sketches -------------------------------------------
[env:panel_tester]
extends = esp32
build_src_filter = -<*> +<../diag/panel_tester/>

[env:button_test]
extends = esp32
build_src_filter = -<*> +<../diag/button_test/>

[env:sd_test]
extends = esp32
build_src_filter = -<*> +<../diag/sd_test/>

; --- host unit tests for lib/core (no Arduino, no hardware) ------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra

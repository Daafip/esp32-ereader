# Builds the firmware for every board and publishes it as a GitHub release when a
# version tag is pushed, plus the browser installer on GitHub Pages
# (https://daafip.github.io/esp32-ereader/). The tag must match FW_VERSION in
# firmware/platformio.ini:
#   git tag v0.9.0 && git push origin v0.9.0
# Pages needs a one-time switch: repository Settings -> Pages -> Source: GitHub Actions.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the release and upload the images

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.59.0
          cache: true

      - name: Cache PlatformIO platforms and toolchains
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Tag matches FW_VERSION
        run: |
          version=$(sed -n 's/.*-DFW_VERSION=\\"\([^\\]*\)\\".*/\1/p' firmware/platformio.ini)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match FW_VERSION $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: System zlib (the inflater's tests compare against it)
        run: dpkg -s zlib1g-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y zlib1g-dev)

      - name: Unit tests (lib/core)
        run: pixi run fw-test

      - name: Build every env
        run: pixi run fw-build

      - name: Collect the images
        run: pixi run fw-dist

      - name: Android firmware switcher (APK)
        # Signed with the release key when the repository has the FWSWITCH_* secrets
        # (docs/firmware-switcher.md), else with this runner's debug key.
        env:
          FWSWITCH_KEYSTORE_B64: ${{ secrets.FWSWITCH_KEYSTORE_B64 }}
          FWSWITCH_KEYSTORE_PASSWORD: ${{ secrets.FWSWITCH_KEYSTORE_PASSWORD }}
          FWSWITCH_KEY_ALIAS: ${{ secrets.FWSWITCH_KEY_ALIAS }}
          FWSWITCH_KEY_PASSWORD: ${{ secrets.FWSWITCH_KEY_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ vars.FDROID_KEY_ALIAS }}
        run: |
          if [ -n "$FWSWITCH_KEYSTORE_B64" ]; then
            echo "$FWSWITCH_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fwswitch.jks"
            export FWSWITCH_KEYSTORE="$RUNNER_TEMP/fwswitch.jks"
            echo "FWSWITCH_SIGNED=1" >> "$GITHUB_ENV"
            # the F-Droid repository key's fingerprint, for the release notes (not secret)
            fp=$(pixi run -e android keytool -list -v -keystore "$FWSWITCH_KEYSTORE" \
                   -storepass:env FWSWITCH_KEYSTORE_PASSWORD -alias "${FDROID_KEY_ALIAS:-fdroid}" \
                   2>/dev/null | sed -n 's/^.*SHA256: *//p' | tr -d ':' || true)
            [ -n "$fp" ] && echo "FDROID_FINGERPRINT=$fp" >> "$GITHUB_ENV"
          else
            echo "::warning::no FWSWITCH_KEYSTORE_B64 secret: the APK is signed with a debug key"
          fi
          pixi run -e android bash tools/android.sh assembleRelease -PappVersion="$VERSION"
          cp out/android/fw-switch-release.apk "out/firmware/fw-switch-$VERSION.apk"
          rm -f "$RUNNER_TEMP/fwswitch.jks"

      - name: Release notes
        run: bash tools/release_notes.sh "$VERSION" > out/release-notes.md

      - name: Browser installer
        run: pixi run installer

      - name: F-Droid repository (GitHub Pages, fdroid/repo)
        # Only with the release key: F-Droid updates need the same signature every time.
        # A failure here doesn't hold up the firmware release.
        if: env.FWSWITCH_SIGNED == '1'
        continue-on-error: true
        env:
          FWSWITCH_KEYSTORE_B64: ${{ secrets.FWSWITCH_KEYSTORE_B64 }}
          FWSWITCH_KEYSTORE_PASSWORD: ${{ secrets.FWSWITCH_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ vars.FDROID_KEY_ALIAS }}
        run: |
          pipx install fdroidserver==2.4.5
          echo "$FWSWITCH_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fwswitch.jks"
          FWSWITCH_KEYSTORE="$RUNNER_TEMP/fwswitch.jks" pixi run -e android bash tools/make_fdroid_repo.sh \
            "out/firmware/fw-switch-$VERSION.apk" out/installer/fdroid
          rm -f "$RUNNER_TEMP/fwswitch.jks"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/installer

      - uses: softprops/action-gh-release@v3
        with:
          name: Firmware ${{ env.VERSION }}
          body_path: out/release-notes.md
          prerelease: false  # the T5-2.13 is tested; the notes say the others aren't
          files: |
            out/firmware/*-${{ env.VERSION }}*.bin
            out/firmware/fw-switch-${{ env.VERSION }}.apk
          fail_on_unmatched_files: true

  installer:
    # A separate job: if Pages isn't switched on, only this job fails, not the release.
    needs: firmware
    runs-on: ubuntu-24.04
    concurrency:  # one Pages deployment at a time, with installer.yml
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

# Builds the firmware for every board and publishes it as a GitHub release when a
# version tag is pushed, plus the browser installer on GitHub Pages
# (https://daafip.github.io/esp32-ereader/). The tag must match FW_VERSION in
# firmware/platformio.ini:
#   git tag v0.9.0 && git push origin v0.9.0
# Pages needs a one-time switch: repository Settings -> Pages -> Source: GitHub Actions.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the release and upload the images

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.59.0
          cache: true

      - name: Cache PlatformIO platforms and toolchains
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Tag matches FW_VERSION
        run: |
          version=$(sed -n 's/.*-DFW_VERSION=\\"\([^\\]*\)\\".*/\1/p' firmware/platformio.ini)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match FW_VERSION $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Unit tests (lib/core)
        run: pixi run fw-test

      - name: Build every env
        run: pixi run fw-build

      - name: Collect the images
        run: pixi run fw-dist

      - name: Release notes
        run: bash tools/release_notes.sh "$VERSION" > out/release-notes.md

      - name: Browser installer
        run: pixi run installer

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/installer

      - uses: softprops/action-gh-release@v3
        with:
          name: Firmware ${{ env.VERSION }}
          body_path: out/release-notes.md
          prerelease: false  # the T5-2.13 is tested; the notes say the others aren't
          files: out/firmware/*-${{ env.VERSION }}*.bin
          fail_on_unmatched_files: true

  installer:
    # A separate job: if Pages isn't switched on, only this job fails, not the release.
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

Name: Firmware switcher
Summary: Switch an ESP32-C6 e-reader between its firmware and ESPHome over USB
Description: |-
  Puts the e-reader firmware or ESPHome on a FireBeetle 2 ESP32-C6 with a 7.5"
  e-paper panel (the home-built reader of github.com/Daafip/esp32-ereader) over a
  USB-C OTG cable, without a PC.

  Choose the two firmware files once (the reader's full image and ESPHome's factory
  image); then one tap installs either. The app resets the board into download mode
  itself (or asks for BOOT + RST while it sleeps), writes only what changed, checks
  it and restarts the board. When both firmwares share a partition table, settings
  and the books in the flash stay.

  ESP32-C6 boards on their own USB port only. Needs a phone with USB host (OTG).
